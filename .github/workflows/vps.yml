# Compila la imagen de producción, la sube a GHCR y la deploya en la VPS (devSoulIt/vps-infra).
#
# Configuración del repo en GitHub (Settings → Secrets and variables → Actions):
#   Secrets:   VPS_HOST, VPS_SSH_KEY (clave privada del usuario deploy)
#   Variables: NEXT_PUBLIC_* que use la app (se hornean en el bundle)
#   Variable:  VPS_DEPLOY=true para que además del build haga el deploy (sin ella solo compila).
#
# Todas las imágenes viven en ghcr.io/devsoulit, así la VPS baja todo con un solo token.
name: VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: vps-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGEN: ghcr.io/devsoulit/devsoul-landing
  APP: landing

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USER || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - id: tags
        run: |
          imagen=$(echo "$IMAGEN" | tr '[:upper:]' '[:lower:]')
          echo "imagen=$imagen" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.imagen }}:latest
            ${{ steps.tags.outputs.imagen }}:${{ steps.tags.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
    outputs:
      sha: ${{ steps.tags.outputs.sha }}

  deploy:
    needs: build
    if: vars.VPS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: /opt/devsoul/scripts/deploy.sh ${{ env.APP }} ${{ needs.build.outputs.sha }}
